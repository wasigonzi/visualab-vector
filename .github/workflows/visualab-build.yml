name: Visualab Windows build
on:
  push:
    branches: [visualab-branding]
  workflow_dispatch:
concurrency:
  group: visualab-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Test branding
        shell: pwsh
        run: cargo +stable test -p vectorcraft-ui-egui --lib visualab_brand_tests
      - name: Build installer and portable application
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: Visualab-Windows-x64
          path: dist/release/*windows-x64*
          if-no-files-found: error

  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libasound2-dev mesa-vulkan-drivers xvfb
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Branding tests
        run: cargo +stable test -p vectorcraft-ui-egui --lib visualab_brand_tests
      - name: Engine tests
        run: cargo +stable test -p vectorcraft-engine --lib
